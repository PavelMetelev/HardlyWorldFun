    <rect x="1438" y="652" width="17" height="29"/><rect x="1549" y="635" width="17" height="29"/>
    <rect x="1654" y="668" width="17" height="29"/><rect x="1763" y="636" width="17" height="29"/>
    <rect x="1856" y="618" width="17" height="29"/>
  </g>
</g>

<!-- boats -->
<g stroke="#171A1F" stroke-width="7" stroke-linecap="round">
  <path d="M1110 795L1170 795L1150 833H1126L1110 795Z" fill="#6B4A32"/>
  <path d="M1140 790V700" stroke="#2A2522"/>
  <path d="M1140 705L1188 748L1140 760Z" fill="#EAD8B0" stroke="none"/>
  <path d="M1450 735L1505 735L1488 768H1467L1450 735Z" fill="#6B4A32"/>
  <path d="M1478 731V657" stroke="#2A2522"/>
  <path d="M1478 662L1518 696L1478 707Z" fill="#EAD8B0" stroke="none"/>
</g>

<!-- foreground foliage -->
<g opacity=".92">
  <circle cx="85" cy="950" r="100" fill="#0A2C20"/><circle cx="180" cy="1020" r="130" fill="#0D3525"/>
  <circle cx="1825" cy="972" r="145" fill="#081C15"/><circle cx="1718" cy="1040" r="105" fill="#0C2E22"/>
</g>

<!-- dark cinematic veil -->
<rect width="1920" height="1200" fill="#02060B" opacity=".10"/>
<rect width="1920" height="1200" fill="url(#grid)"/>
<rect x="0" y="0" width="1920" height="1200" fill="url(#sky)" opacity=".03"/>
</svg>