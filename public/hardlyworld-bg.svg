  <path d="M1010 160L1075 135L1138 157L1120 189L1062 201L1018 188Z" fill="#193040"/>
  <path d="M1052 197L1120 190L1103 232L1060 240L1028 222Z" fill="#0D1A23"/>
</g>

<!-- mountains -->
<path d="M0 705L155 535L310 650L510 398L718 650L910 455L1110 685L1295 445L1500 645L1695 495L1920 620V900H0V705Z" fill="url(#mountain)"/>
<path d="M0 760L225 580L390 720L620 520L835 735L1065 540L1295 740L1510 545L1745 730L1920 625V900H0V760Z" fill="#183447"/>

<!-- left castle -->
<g>
  <path d="M40 575L90 520L160 536L190 489L245 520L285 455L350 500L385 425L450 474L493 405L548 450L548 710H40V575Z" fill="#0A1118"/>
  <path d="M75 552L125 470L158 470L180 430L210 486L250 438L283 438L305 388L337 455L375 398L412 398L435 350L470 428L505 360L535 430L548 710H75V552Z" fill="#172735"/>
