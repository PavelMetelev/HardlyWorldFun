    <rect x="127" y="532" width="18" height="34" rx="3"/><rect x="202" y="500" width="18" height="34" rx="3"/>
    <rect x="286" y="472" width="18" height="34" rx="3"/><rect x="379" y="445" width="18" height="34" rx="3"/>
    <rect x="455" y="414" width="18" height="34" rx="3"/><rect x="500" y="505" width="18" height="34" rx="3"/>
  </g>
  <path d="M110 650C180 570 255 590 315 655C368 714 430 688 500 638" stroke="#5ED6FF" stroke-opacity=".62" stroke-width="16"/>
  <path d="M105 669C195 604 265 622 320 682C370 736 427 710 507 660" stroke="#B7F0FF" stroke-opacity=".34" stroke-width="5"/>
</g>

<!-- center bay -->
<path d="M0 735C230 700 390 748 610 720C820 690 1020 735 1220 705C1450 670 1650 715 1920 685V1200H0V735Z" fill="url(#water)"/>
<path d="M0 790C230 752 420 812 645 778C860 746 1060 785 1260 758C1475 730 1700 772 1920 742" stroke="#79E9FF" stroke-opacity=".18" stroke-width="8"/>
<path d="M0 910C250 866 468 925 760 884C1050 845 1270 915 1570 866C1695 846 1810 856 1920 840" stroke="#BEEFFF" stroke-opacity=".11" stroke-width="5"/>

<!-- right settlement -->
<g>
  <path d="M1370 650L1440 585L1500 610L1545 535L1610 578L1670 520L1730 575L1790 505L1880 570L1920 620V810H1370V650Z" fill="#213845"/>
  <g fill="#2C4B59">
    <rect x="1410" y="620" width="85" height="150"/><rect x="1522" y="602" width="74" height="168"/>
    <rect x="1620" y="635" width="96" height="135"/><rect x="1735" y="603" width="82" height="167"/>
    <rect x="1830" y="585" width="72" height="185"/>
  </g>
