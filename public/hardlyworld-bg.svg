<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="960" y1="0" x2="960" y2="760" gradientUnits="userSpaceOnUse">
    <stop stop-color="#06111F"/>
    <stop offset=".45" stop-color="#0D1B32"/>
    <stop offset=".72" stop-color="#321D3E"/>
    <stop offset="1" stop-color="#EA7147"/>
  </linearGradient>
  <linearGradient id="water" x1="960" y1="650" x2="960" y2="1200" gradientUnits="userSpaceOnUse">
    <stop stop-color="#102A3B"/>
    <stop offset=".5" stop-color="#07151F"/>
    <stop offset="1" stop-color="#04080D"/>
  </linearGradient>
  <linearGradient id="mountain" x1="960" y1="420" x2="960" y2="820" gradientUnits="userSpaceOnUse">
    <stop stop-color="#182C3D"/>
    <stop offset="1" stop-color="#0A141D"/>
  </linearGradient>
  <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1470 560) rotate(90) scale(190)">
    <stop stop-color="#FFF3C4"/>
    <stop offset=".28" stop-color="#FDBA74" stop-opacity=".85"/>
    <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="aurora" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 250) rotate(90) scale(280 720)">
    <stop stop-color="#6EE7F9" stop-opacity=".48"/>
    <stop offset=".45" stop-color="#38BDF8" stop-opacity=".08"/>
    <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
    <path d="M64 0H0V64" stroke="#FFFFFF" stroke-opacity=".035"/>
  </pattern>
</defs>

<rect width="1920" height="1200" fill="url(#sky)"/>
<rect width="1920" height="760" fill="url(#aurora)"/>
<circle cx="1470" cy="560" r="230" fill="url(#sun)"/>

<!-- stars -->
<g fill="#DDF7FF">
  <circle cx="96" cy="118" r="2"/><circle cx="180" cy="184" r="1.5"/><circle cx="262" cy="95" r="1.4"/>
  <circle cx="350" cy="150" r="2"/><circle cx="445" cy="78" r="1.2"/><circle cx="540" cy="185" r="1.4"/>
  <circle cx="664" cy="112" r="1.8"/><circle cx="770" cy="68" r="1.3"/><circle cx="876" cy="156" r="1.6"/>
  <circle cx="1000" cy="92" r="1.5"/><circle cx="1128" cy="132" r="1.8"/><circle cx="1255" cy="78" r="1.3"/>
  <circle cx="1390" cy="136" r="1.7"/><circle cx="1504" cy="86" r="1.4"/><circle cx="1640" cy="174" r="1.7"/>
  <circle cx="1775" cy="95" r="1.3"/>
</g>

<!-- aurora ribbons -->
<path d="M540 0C720 120 805 70 930 170C1070 282 1170 96 1340 0" stroke="#67E8F9" stroke-opacity=".36" stroke-width="90" fill="none" filter="url(#soft)"/>
<path d="M780 0C875 130 1010 70 1120 212C1240 350 1320 135 1510 42" stroke="#A78BFA" stroke-opacity=".28" stroke-width="70" fill="none" filter="url(#soft)"/>

<!-- distant floating islands -->
