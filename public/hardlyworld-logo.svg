<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" fill="none">
<defs>
  <linearGradient id="steel" x1="110" y1="100" x2="430" y2="245" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F4F5F6"/><stop offset=".12" stop-color="#70777E"/><stop offset=".34" stop-color="#22272C"/>
    <stop offset=".53" stop-color="#8D959C"/><stop offset=".72" stop-color="#24292E"/><stop offset="1" stop-color="#C9CED2"/>
  </linearGradient>
  <linearGradient id="hot" x1="90" y1="80" x2="470" y2="260" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFD7C8"/><stop offset=".18" stop-color="#FF6A4D"/><stop offset=".48" stop-color="#FF1F00"/>
    <stop offset=".78" stop-color="#FF6A2A"/><stop offset="1" stop-color="#9B140B"/>
  </linearGradient>
  <radialGradient id="fire" cx=".5" cy=".5" r=".55">
    <stop stop-color="#FF5A2F" stop-opacity=".8"/><stop offset=".45" stop-color="#D92711" stop-opacity=".34"/><stop offset="1" stop-color="#5B0904" stop-opacity="0"/>
  </radialGradient>
  <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
    <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#000" flood-opacity=".85"/>
  </filter>
  <pattern id="cracks" width="70" height="70" patternUnits="userSpaceOnUse">
    <path d="M7 4L20 19L12 33L29 47L23 64M50 6L42 22L57 37L47 55L61 69M33 8L29 27L38 42L30 59" stroke="#FF3B1F" stroke-width="2" stroke-opacity=".75"/>
  </pattern>
</defs>

<ellipse cx="280" cy="188" rx="205" ry="100" fill="url(#fire)" filter="url(#softGlow)"/>

<!-- flame ribbons -->
<g fill="none" stroke-linecap="round" filter="url(#redGlow)" opacity=".86">
  <path d="M64 192C118 139 178 135 232 163C299 198 347 203 491 123" stroke="#FF3218" stroke-width="5"/>
  <path d="M73 224C132 176 183 173 245 205C319 243 379 221 500 165" stroke="#FF6A27" stroke-width="3"/>
  <path d="M93 106C140 72 175 77 215 99C252 120 302 124 353 93" stroke="#FF3B1F" stroke-width="3"/>
</g>

<!-- crown -->
<g filter="url(#shadow)">
  <path d="M164 97L188 46L223 70L280 23L337 70L372 46L396 97L376 116H184Z" fill="#15191E" stroke="url(#hot)" stroke-width="6"/>
  <path d="M177 95L191 62L223 82L280 34L337 82L369 62L383 95Z" fill="url(#steel)" opacity=".92"/>
  <path d="M267 43L280 22L293 43L280 58Z" fill="#FF5D3C" stroke="#FFD3C8" stroke-width="2" filter="url(#redGlow)"/>
</g>

<!-- fiery outer silhouette -->
<text x="280" y="248" text-anchor="middle"
  font-family="Arial Black, Impact, sans-serif" font-size="162" font-weight="900"
  letter-spacing="-16" fill="none" stroke="url(#hot)" stroke-width="30"
  paint-order="stroke" filter="url(#redGlow)">HW</text>

<!-- black steel bevel -->
<text x="280" y="248" text-anchor="middle"
  font-family="Arial Black, Impact, sans-serif" font-size="162" font-weight="900"
  letter-spacing="-16" fill="url(#steel)" stroke="#090C10" stroke-width="7"
  paint-order="stroke" filter="url(#shadow)">HW</text>

<!-- molten inner outline -->
<text x="280" y="248" text-anchor="middle"
  font-family="Arial Black, Impact, sans-serif" font-size="162" font-weight="900"
  letter-spacing="-16" fill="url(#steel)" stroke="#FF4327" stroke-width="4"
  paint-order="stroke">HW</text>

<!-- cracks over metal -->
<text x="280" y="248" text-anchor="middle"
  font-family="Arial Black, Impact, sans-serif" font-size="162" font-weight="900"
  letter-spacing="-16" fill="url(#cracks)" opacity=".92">HW</text>

<!-- hot highlights -->
<path d="M147 204L189 157L224 191M325 205L365 160L402 198" stroke="#FFF5E8" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
<g fill="#FF6A3D" filter="url(#redGlow)">
  <circle cx="109" cy="157" r="4"/><circle cx="128" cy="250" r="3"/><circle cx="442" cy="141" r="4"/><circle cx="465" cy="231" r="3"/>
  <circle cx="155" cy="121" r="2.5"/><circle cx="414" cy="105" r="2.5"/><circle cx="205" cy="278" r="2.5"/><circle cx="381" cy="276" r="2.5"/>
</g>
</svg>