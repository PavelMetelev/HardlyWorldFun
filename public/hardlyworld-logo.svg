<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="HardlyWorld HW logo">
  <defs>
    <linearGradient id="metal" x1="45" y1="30" x2="270" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5F2"/>
      <stop offset=".2" stop-color="#B8C0C8"/>
      <stop offset=".48" stop-color="#5E6670"/>
      <stop offset=".72" stop-color="#D3DAE0"/>
      <stop offset="1" stop-color="#3E454D"/>
    </linearGradient>
    <linearGradient id="edge" x1="55" y1="45" x2="260" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9D84"/>
      <stop offset=".45" stop-color="#FF3B1F"/>
      <stop offset="1" stop-color="#8C1108"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(160 102) rotate(90) scale(95 140)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5B3A" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FF2100" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".8"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="103" rx="126" ry="60" fill="url(#core)"/>
  <g fill="none" stroke="#FF4A2D" stroke-linecap="round" filter="url(#glow)" opacity=".75">
    <path d="M42 101c28-34 66-43 103-30 38 14 69 8 126-24" stroke-width="2"/>
    <path d="M37 126c39-26 76-25 111-9 39 18 84 3 131-29" stroke-width="1.5"/>
    <path d="M55 60c30-24 56-24 82-7 24 15 52 16 94-8" stroke-width="1.5"/>
  </g>

  <!-- crown -->
  <g filter="url(#shadow)">
    <path d="M92 46L109 19L132 35L160 8L188 35L211 19L228 46L214 61H106Z"
      fill="#242A31" stroke="url(#edge)" stroke-width="3"/>
    <path d="M104 46L111 30L132 44L160 16L188 44L209 30L216 46Z"
      fill="url(#metal)" opacity=".7"/>
    <path d="M154 21L160 13L166 21L160 29Z" fill="#FF6546" filter="url(#glow)"/>
  </g>

  <!-- main mark -->
  <g filter="url(#shadow)">
    <text x="160" y="125"
      text-anchor="middle"
      font-family="Arial Black, Impact, sans-serif"
      font-size="104"
      font-weight="900"
      letter-spacing="-10"
      fill="#090C10"
      stroke="url(#edge)"
      stroke-width="12"
      paint-order="stroke">HW</text>
    <text x="160" y="125"
      text-anchor="middle"
      font-family="Arial Black, Impact, sans-serif"
      font-size="104"
      font-weight="900"
      letter-spacing="-10"
      fill="url(#metal)"
      stroke="#171B20"
      stroke-width="3"
      paint-order="stroke">HW</text>
    <text x="160" y="125"
      text-anchor="middle"
      font-family="Arial Black, Impact, sans-serif"
      font-size="104"
      font-weight="900"
      letter-spacing="-10"
      fill="none"
      stroke="#FF4A2D"
      stroke-opacity=".8"
      stroke-width="2">HW</text>
  </g>

  <g fill="#FF5B3A" filter="url(#glow)">
    <circle cx="70" cy="92" r="2.5"/><circle cx="248" cy="79" r="2"/>
    <circle cx="88" cy="132" r="2"/><circle cx="232" cy="136" r="2.5"/>
    <circle cx="118" cy="74" r="1.5"/><circle cx="206" cy="66" r="1.5"/>
  </g>
</svg>