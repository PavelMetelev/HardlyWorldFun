name: Build site

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use local HardlyWorld artwork
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          if [ ! -s public/hardlyworld-bg.png ]; then
            echo "Background asset is missing; add public/hardlyworld-bg.png to the repository."
            exit 1
          fi
          file public/hardlyworld-bg.png

      - name: Tight crop favicon artwork
        if: github.event_name == 'push'
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("public/favicon.png")
          img = Image.open(path).convert("RGBA")

          alpha = img.getchannel("A")
          bbox = alpha.getbbox()

          # The source logo has transparent padding. Crop to the visible artwork
          # so the same 16x16 browser slot shows a much larger HW emblem.
          if bbox:
              left, top, right, bottom = bbox
              pad = max(1, int(max(right - left, bottom - top) * 0.02))
              left = max(0, left - pad)
              top = max(0, top - pad)
              right = min(img.width, right + pad)
              bottom = min(img.height, bottom + pad)
              img = img.crop((left, top, right, bottom))

          # Keep transparency and make the artwork fill the favicon canvas.
          box = 64
          margin = 2
          inner = box - margin * 2
          scale = min(inner / img.width, inner / img.height)
          resized = img.resize(
              (max(1, round(img.width * scale)), max(1, round(img.height * scale))),
              Image.Resampling.LANCZOS,
          )

          canvas = Image.new("RGBA", (box, box), (0, 0, 0, 0))
          x = (box - resized.width) // 2
          y = (box - resized.height) // 2
          canvas.alpha_composite(resized, (x, y))
          canvas.save(path, format="PNG", optimize=True)

          print("Saved cropped favicon:", path)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.png
          if git diff --cached --quiet; then
            echo "Favicon already tightly cropped."
          else
            git commit -m "Tight crop HW favicon"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
