name: Build site

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use local HardlyWorld artwork
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          if [ ! -s public/hardlyworld-bg.png ]; then
            echo "Background asset is missing; add public/hardlyworld-bg.png to the repository."
            exit 1
          fi
          file public/hardlyworld-bg.png

      - name: Sync exact uploaded HW favicon
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          curl -L --fail --retry 3 --retry-all-errors "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f0019d7b-2de4-4cdb-b91f-216d3aa401a0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTUxMWFlNmJkNTcyYjNiZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUzMzU0N30.gKiKZBP67HBEc32xRHXibRy0WIiCldm623Gej8icek" -o public/favicon.png
          file public/favicon.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.png
          if git diff --cached --quiet; then
            echo "Favicon already up to date."
          else
            git commit -m "Update HardlyWorld favicon"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
