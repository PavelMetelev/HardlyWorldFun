name: Build site

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use local HardlyWorld artwork
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          if [ ! -s public/hardlyworld-bg.png ]; then
            echo "Background asset is missing; add public/hardlyworld-bg.png to the repository."
            exit 1
          fi
          file public/hardlyworld-bg.png

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
