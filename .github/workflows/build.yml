name: Build site

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Store uploaded HardlyWorld artwork locally
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          curl -L --fail --retry 3 --retry-all-errors             "https://d2jqrm6oza8nb6.cloudfront.net/datasets/38b0fdd8-0f3f-40dc-a8ce-1d92d1b8b846.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmFjNDJhYzJhYTU5NTY0ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUwMjQwMn0.qpuXzhiN184HXUnn8hTcdDZKMHKUuMsMUe1eeT1GP0g"             -o public/hardlyworld-bg.jpg
          test -s public/hardlyworld-bg.jpg
          file public/hardlyworld-bg.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hardlyworld-bg.jpg
          if git diff --cached --quiet; then
            echo "Background already stored."
          else
            git commit -m "Add uploaded HardlyWorld background"
            git push
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
